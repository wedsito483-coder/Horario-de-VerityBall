name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el ZIP del proyecto
        run: |
          mkdir -p proyecto
          for z in *.zip; do
            if unzip -l "$z" | grep -q 'settings.gradle'; then
              unzip -o -q "$z" -d proyecto
            fi
          done
          ls -la proyecto

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Horario-Verityball-APK
          path: proyecto/app/build/outputs/apk/debug/*.apk
